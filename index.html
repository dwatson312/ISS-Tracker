
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ISS Tracker</title>

        <link rel="icon" type="image/x-icon" href="iss-icon.png">
        <link rel="stylesheet" href="iss-tracker.css">
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />
    </head>

    <body>
        <header class="page-header">
            <h1>ISS Tracker</h1>
            <p>
                Live position tracking for the International Space Station (ISS).
                Displays its current location and coordinates, updating every five seconds.
            </p>
        </header>

        <main id="tracker">
            <div id="map"></div>

            <section id="dataDisplay">
                <h2>ISS Position Data</h2>

                <div class="position-data">
                    <p id="latitude">Latitude:</p>
                    <p id="longitude">Longitude:</p>
                    <p id="timestamp">Timestamp:</p>
                </div>
            </section>
        </main>

        <footer>
            ISS position data provided by
            <a href="https://wheretheiss.at/" target="_blank" rel="noopener noreferrer">Where The ISS At</a>.
        </footer>

        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="">
        </script>
        <script src="iss-tracker.js"></script>
    </body>
</html>
